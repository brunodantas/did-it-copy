<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>did-it-copy</title>
  <meta name="description" content="Copy is the one edit command that changes nothing on screen. A proposal for copy feedback on the desktop.">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,800&amp;display=swap">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/home.js"></script>
</head>
<body>
<div class="page">
  <header class="site-header">
    <a class="site-name" href="./" aria-current="page">did-it-copy</a>
    <nav class="site-nav" aria-label="Site">
      <ul>
        <li><a href="what.html">What</a></li>
        <li><a href="precedent.html">Precedent</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
    </nav>
  </header>

  <main class="hero">
    <p class="eyebrow">Try it</p>
    <h1 class="hero-sentence" id="sentence">Copy this sentence.</h1>
    <p class="hero-instruction">
      <span>Select it, then press</span>
      <kbd data-copy-key>Ctrl</kbd>
      <kbd>C</kbd>
    </p>

    <div class="answer" aria-live="polite">
      <div class="answer-body" id="answer" hidden>
        <h2 id="answer-heading">Did it work?</h2>
        <p id="verdict"></p>
        <button class="button" id="feedback-toggle" type="button" aria-pressed="false">Turn on the flash, then copy again</button>
        <a href="what.html#demo">Compare them side by side</a>
      </div>
      <button class="text-button" id="skip" type="button">No keyboard? Skip ahead</button>
    </div>
  </main>
</div>

<footer class="site-footer">
  <span>did-it-copy. A proposal for copy feedback on the desktop.</span>
  <ul>
    <li><a href="https://creativecommons.org/licenses/by/4.0/">Content CC BY 4.0</a></li>
    <li><a href="https://github.com/brunodantas/did-it-copy/blob/main/LICENSE">Code MIT</a></li>
    <li><a href="https://github.com/brunodantas/did-it-copy">GitHub</a></li>
  </ul>
</footer>
</body>
</html>
